<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电脑硬件价格追踪</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
<div id="app">
  <!-- 顶部：爬取入口 -->
  <div class="toolbar">
    <h1>电脑硬件价格追踪</h1>
    <div class="search-row">
      <input type="text" id="keyword" placeholder="输入硬件关键词，如 RTX 4070、i5 14600KF">
      <select id="category">
        <option value="CPU">CPU</option>
        <option value="GPU">显卡</option>
        <option value="RAM">内存</option>
        <option value="MB">主板</option>
        <option value="SSD">固态硬盘</option>
      </select>
      <select id="crawl-count">
        <option value="10">10条</option>
        <option value="15">15条</option>
        <option value="20" selected>20条</option>
        <option value="25">25条</option>
        <option value="30">30条</option>
      </select>
      <button id="btn-crawl" onclick="startCrawl()">开始爬取</button>
    </div>
    <div id="crawl-status" class="status"></div>
    <div class="history-box">
      <div class="history-header">
        <span>搜索记录</span>
        <button class="clear-btn" onclick="clearHistory()">清空记录</button>
      </div>
      <div id="history-list" class="history-list">
        <div class="history-empty">暂无搜索记录</div>
      </div>
    </div>
  </div>

  <!-- 中间：数据展示 -->
  <div class="content">
    <div class="panel-header">
      <div id="stats-bar" class="stats-bar">暂无数据 — 请在上方输入关键词并点击"开始爬取"</div>
      <div class="search-db-row">
        <input type="text" id="db-search" placeholder="搜索数据库产品名称，如 RTX、i5、三星..." oninput="onDbSearch()">
        <button class="clear-search-btn" onclick="clearDbSearch()" style="display:none">✕</button>
      </div>
      <div class="filter-bar">
        <button class="cat-btn active" data-cat="ALL">全部</button>
        <button class="cat-btn" data-cat="CPU">CPU</button>
        <button class="cat-btn" data-cat="GPU">显卡</button>
        <button class="cat-btn" data-cat="RAM">内存</button>
        <button class="cat-btn" data-cat="MB">主板</button>
        <button class="cat-btn" data-cat="SSD">SSD</button>
        <select id="sort-select" class="sort-select" onchange="onSortChange()">
          <option value="time_desc">🕐 时间最新</option>
          <option value="time_asc">🕐 时间最早</option>
          <option value="name">🔤 名称 A-Z</option>
          <option value="category">📂 品类</option>
          <option value="price_asc">💰 价格 ↑</option>
          <option value="price_desc">💰 价格 ↓</option>
        </select>
      </div>
    </div>

    <!-- 统计仪表盘 -->
    <div class="stats-dashboard" id="stats-dashboard">
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-info">
          <div class="stat-label">产品总数</div>
          <div class="stat-value" id="stat-total">--</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-info">
          <div class="stat-label">整体均价</div>
          <div class="stat-value" id="stat-avg">--</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📉</div>
        <div class="stat-info">
          <div class="stat-label">最低价格</div>
          <div class="stat-value low" id="stat-min">--</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📈</div>
        <div class="stat-info">
          <div class="stat-label">最高价格</div>
          <div class="stat-value high" id="stat-max">--</div>
        </div>
      </div>
    </div>

    <div class="data-panel" id="data-panel">
      <div class="table-wrap" id="table-wrap">
        <table id="product-table">
          <thead>
            <tr><th>产品名称</th><th>品类</th><th>最新价格</th><th>更新时间</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="resizer" id="resizer"></div>
      <div class="chart-wrap" id="chart-wrap">
        <div class="chart-tabs">
          <button class="chart-tab active" data-tab="trend" onclick="switchChartTab('trend')">📈 价格趋势</button>
          <button class="chart-tab" data-tab="category" onclick="switchChartTab('category')">📊 品类对比</button>
          <button class="chart-tab" data-tab="distribution" onclick="switchChartTab('distribution')">📋 价格分布</button>
        </div>
        <div id="price-chart" style="width:100%;height:380px;">
          <div class="chart-empty">点击左侧产品查看价格趋势</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部：AI助手 -->
  <div class="ai-panel">
    <div class="ai-panel-header">
      <h3>AI 分析助手</h3>
      <button class="settings-btn" onclick="openSettings()" title="AI 设置">⚙️ 设置</button>
    </div>
    <div class="ai-modes">
      <div class="ai-prompt-bar" id="ai-prompt-bar">
        <!-- JS 动态渲染提示词标签 -->
      </div>
      <label class="stream-toggle" title="流式输出（打字机效果）">
        <input type="checkbox" id="stream-toggle" checked onchange="toggleStream()">
        <span class="toggle-label">流式输出</span>
      </label>
    </div>
    <div id="ai-chat" class="ai-chat"></div>
    <div class="ai-input">
      <input type="text" id="ai-input" placeholder="输入问题，如：RTX 4070 最近降价了吗？" onkeydown="if(event.key==='Enter')sendMessage()">
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- AI 设置面板 -->
  <div id="settings-overlay" class="settings-overlay" style="display:none">
    <div class="settings-modal">
      <div class="settings-header">
        <h2>⚙️ AI 助手设置</h2>
        <button class="settings-close" onclick="closeSettings()">✕</button>
      </div>
      <div class="settings-body">
        <div class="settings-tabs">
          <button class="stab active" data-tab="provider">🔗 服务配置</button>
          <button class="stab" data-tab="prompts">📝 预设提示词</button>
        </div>
        <div class="settings-content">
          <!-- 服务配置 -->
          <div id="tab-provider" class="stab-content active">
            <div class="form-group">
              <label>API 地址</label>
              <input type="text" id="set-baseUrl" placeholder="https://api.openai.com/v1">
              <span class="form-hint">支持 OpenAI 兼容接口（DeepSeek、通义千问等）</span>
            </div>
            <div class="form-group">
              <label>API Key</label>
              <input type="text" id="set-apiKey" placeholder="sk-...">
            </div>
            <div class="form-group">
              <label>模型选择</label>
              <div class="input-with-btn">
                <select id="set-model">
                  <option value="">请先拉取模型列表</option>
                </select>
                <button class="fetch-models-btn" onclick="fetchModels()" id="btn-fetch-models">🔍 拉取模型</button>
              </div>
              <span id="models-status" class="form-hint"></span>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Temperature <small>(0-2)</small></label>
                <input type="number" id="set-temperature" min="0" max="2" step="0.1" value="0.7">
              </div>
              <div class="form-group">
                <label>Max Tokens</label>
                <input type="number" id="set-maxTokens" min="100" max="128000" step="100" value="2048">
              </div>
            </div>
            <div class="settings-actions">
              <button class="btn-primary" onclick="saveSettings()">💾 保存设置</button>
              <button class="btn-secondary" onclick="loadSettings()">↻ 重新加载</button>
            </div>
            <div id="settings-msg" class="settings-msg"></div>
          </div>

          <!-- 预设提示词（只读） -->
          <div id="tab-prompts" class="stab-content">
            <div class="prompts-toolbar">
              <span class="prompts-info">以下为系统预设的四种 AI 分析模式</span>
            </div>
            <div id="prompts-list" class="prompts-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 预览面板（爬取完成后弹出） -->
  <div id="preview-panel" class="preview-overlay" style="display:none">
    <div class="preview-modal">
      <div class="preview-header">
        <h2 id="preview-title">爬取结果预览</h2>
        <button class="preview-close" onclick="closePreview()">✕</button>
      </div>
      <div class="preview-toolbar">
        <label><input type="checkbox" id="select-all" onchange="toggleSelectAll()" checked> 全选</label>
        <span id="preview-count" class="preview-count"></span>
        <button class="preview-btn save-btn" onclick="confirmSave()">存入选中</button>
        <button class="preview-btn save-all-btn" onclick="confirmSaveAll()">全部存入</button>
      </div>
      <div id="preview-list" class="preview-list"></div>
    </div>
  </div>
</div>

<script src="js/charts.js"></script>
<script src="js/ai-chat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
